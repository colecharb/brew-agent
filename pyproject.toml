[project]
name = "brew-agent"
version = "0.1.0"
description = "Internal experiment: brew diagnosis agent evaluated against baselines"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "supabase>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brew_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
